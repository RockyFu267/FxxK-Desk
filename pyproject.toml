[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxxk-desk"
version = "0.1.0"
description = "Windows desktop observation and local gateway integration"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
automation = ["pywinauto>=0.6.9", "rapidocr>=3.10,<4", "onnxruntime>=1.20", "numpy>=1.24"]

[project.scripts]
fxxk-desk = "fxxk_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
